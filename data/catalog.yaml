# 데이터셋 설명서 (선택 사항)
# 파일 이름을 키로 제목·출처·설명·컬럼 메모를 적으면 에이전트가 데이터를 더 정확히 이해합니다.
# 실제 데이터를 넣으면 같은 형식으로 항목을 추가하세요.

샘플_제주_읍면동_업종별_카드소비.csv:
  title: "[가상] 제주 읍면동·업종별 카드 소비"
  source: "데모용 합성 데이터 (scripts/make_sample_data.py, 실제 통계 아님)"
  description: "2025년 월별, 읍면동·업종·이용자구분·요일별 카드 이용건수와 이용금액"
  columns:
    기준년월: "YYYY-MM 형식"
    이용자구분: "도민 / 내국인관광객 / 외국인관광객"
    이용금액: "단위: 원"

샘플_제주_일별_입도객_기상.csv:
  title: "[가상] 제주 일별 입도객 수와 기상"
  source: "데모용 합성 데이터 (scripts/make_sample_data.py, 실제 통계 아님)"
  description: "2025년 일별 내국인·외국인 입도객 수, 강수량, 평균기온"
  columns:
    강수량_mm: "일 강수량(mm)"
    평균기온_C: "일 평균기온(섭씨)"

